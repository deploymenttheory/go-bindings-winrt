name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # Generated syscall wrappers trip vet's unsafe.Pointer heuristic by
      # design; vet everything hand-written instead.
      - name: Vet (non-generated packages)
        run: go vet ./cmd/... ./internal/... ./acceptance/

      # The runtime is vetted with unsafeptr DISABLED, and only that check.
      #
      # winrt.InParam converts an address native code supplied into a pointer to
      # write through, which is what a Go body implementing a WinRT method must do
      # with its out-parameters. vet's unsafeptr heuristic flags every
      # uintptr-to-unsafe.Pointer conversion, and here it is wrong for a reason no
      # rewrite can address: the word IS a native address and there is no Go pointer
      # it came from. Every other analyzer still runs, and the whole check stays on
      # for every other package.
      - name: Vet the runtime (unsafeptr exempted, see winrt.InParam)
        run: go vet -unsafeptr=false ./bindings/runtime/...

      # The module is windows/amd64 only. Go's asm_windows_arm64.s loads
      # only R0-R7 and never touches V0-V7 (it still carries a "TODO(rsc)
      # floating point like amd64" note), so on arm64 every float and
      # homogeneous-float-aggregate argument would be silently corrupted.
      # Assert the constraint holds rather than cross-compiling for an
      # architecture the bindings deliberately exclude.
      - name: Assert amd64-only build constraints
        # windows-latest defaults to PowerShell, where this bash `if` is a parse
        # error — so the assertion had never actually run, and the step failed on
        # every push instead of checking anything.
        shell: bash
        run: |
          if git grep -l 'go:build windows && (amd64 || arm64)' -- '*.go'; then
            echo "::error::files still claim arm64; see fileasm.GeneratedBuildTag"
            exit 1
          fi

      - name: Runtime tests (live HSTRING/activation calls)
        run: go test ./bindings/runtime/...

      - name: Slot/IID guard + generator tests (vs committed winmd)
        run: go test ./internal/...

      - name: Acceptance tests (live WinRT calls)
        run: go test ./acceptance/

  regen:
    name: Regeneration determinism gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Ingest committed winmds
        run: go run ./cmd/generate ingest

      - name: Validate metadata
        run: go run ./cmd/generate validate

      # One command clears and re-emits the committed bindings tree (the
      # closure of the roots pinned in metadata/emit-roots.txt) and enforces
      # the diagnostics ratchet.
      - name: Regenerate bindings with ratchet
        run: go run ./cmd/generate bindings --diagnostics-baseline metadata/diagnostics-baseline.json

      - name: Generated output must match the committed tree
        shell: bash
        run: |
          git add -N bindings metadata/winrt
          git diff --exit-code --stat -- bindings metadata/winrt
